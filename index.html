<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preload" as="image" href="assets/hero/hero_mobile_original.png" media="(max-width: 768px)">
  <title>Ahmed Mahdy â€” Graphic Designer & Art Director</title>
  <style>
    @font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:swap;src:url('assets/fonts/outfit-latin-variable.woff2') format('woff2')}
    @font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/dm-mono-latin-400-normal.woff2') format('woff2')}
    @font-face{font-family:'DM Mono';font-style:normal;font-weight:500;font-display:swap;src:url('assets/fonts/dm-mono-latin-500-normal.woff2') format('woff2')}
    :root{--paper:#f7f8f3;--ink:#0b0b0d;--signal:#ef233c;--muted:#767873;--rule:#d9dbd2;--ease:cubic-bezier(.16,1,.3,1);--ease-cinema:cubic-bezier(.76,0,.24,1);color-scheme:light}
    *,*:before,*:after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:85px}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:'Outfit',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    body.intro-active{overflow:hidden}
    button,a{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    ::selection{background:var(--signal);color:white}
    :focus-visible{outline:2px solid var(--signal);outline-offset:5px}
    [hidden]{display:none!important}
    .mono{font-family:'DM Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.18em;font-size:10px;line-height:1.65}
    .red-dot{width:6px;height:6px;display:inline-block;background:var(--signal);border-radius:50%;flex-shrink:0}
    .layout{width:100%;max-width:1720px;margin:auto;padding-inline:clamp(24px,5vw,96px)}
    .rule{height:1px;background:currentColor;opacity:.12;width:100%}
    .site-header{height:89px;position:fixed;z-index:100;top:0;left:0;width:100%;display:flex;align-items:center;padding-inline:clamp(24px,5vw,96px);justify-content:space-between;transition:background .55s,border-color .55s,height .5s;border-bottom:1px solid transparent}
    .site-header.is-scrolled,.site-header.on-detail,.site-header.menu-open{height:75px;background:rgba(247,248,243,.97);border-bottom-color:#12121215;backdrop-filter:blur(18px)}
    .brandmark{display:inline-flex;width:47px;height:47px;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:110}
    .brandmark img{width:100%;height:100%;object-fit:contain}
    .primary-nav{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;gap:clamp(28px,4vw,64px);align-items:center}
    .primary-nav a{position:relative;padding:10px 0;font-size:11px;letter-spacing:.2em;font-weight:500}
    .primary-nav a:after{content:'';position:absolute;left:0;bottom:4px;width:0;height:1px;background:var(--signal);transition:width .45s var(--ease)}
    .primary-nav a:hover:after{width:100%}
    .header-location{display:flex;align-items:center;gap:10px;color:#4b4c48;white-space:nowrap;font-size:9px}
    .menu-toggle{border:0;background:none;width:42px;height:42px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:7px;padding:0;position:relative;z-index:110}
    .menu-toggle span{width:27px;height:1px;background:var(--ink);display:block;transition:transform .4s,width .4s}
    .menu-toggle span:last-child{width:18px;align-self:center;transform:translateX(4px)}
    .menu-toggle.active span:first-child{transform:translateY(4px) rotate(45deg)}
    .menu-toggle.active span:last-child{width:27px;transform:translateY(-4px) rotate(-45deg)}
    .mobile-menu{display:none;position:fixed;inset:0;background:var(--paper);z-index:90;padding:118px 24px 35px;flex-direction:column;justify-content:space-between;transform:translateY(-105%);transition:transform .7s var(--ease-cinema)}
    .mobile-menu.active{transform:translateY(0)}
    .mobile-menu a{display:flex;gap:20px;align-items:baseline;font-size:clamp(48px,11vw,75px);line-height:1.3;letter-spacing:-.05em;font-weight:500}
    .mobile-menu a span{font-size:10px;letter-spacing:0;color:var(--signal)}
    .intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:300;overflow:hidden;transition:clip-path 1.1s var(--ease-cinema);clip-path:inset(0 0 0 0)}
    .intro.dismissed{clip-path:inset(0 0 100% 0);pointer-events:none}
    .intro video{width:min(78vmin,480px);height:min(78vmin,480px);object-fit:contain}
    .intro-skip{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));right:clamp(24px,5vw,75px);border:0;background:transparent;color:var(--signal);min-height:44px;padding:12px;font-size:10px;letter-spacing:.2em;font-family:'DM Mono',monospace}
    .intro-skip:hover{color:var(--signal)}
    .hero{height:100svh;min-height:650px;background:var(--paper);position:relative;overflow:hidden}
    .hero-bg,.hero-bg picture,.hero-bg img{position:absolute;inset:0;width:100%;height:100%}
    .hero-bg img{object-fit:cover;object-position:55% center}
    .hero-content{position:absolute;z-index:2;top:50%;left:clamp(24px,5vw,96px);width:45%;transform:translateY(-46%)}
    .hero-label{display:flex;align-items:center;gap:12px;margin:0 0 26px;color:#363834}
    .hero-label .dash{height:1px;width:31px;background:var(--signal)}
    .hero h1{font-size:clamp(72px,8vw,144px);line-height:.88;letter-spacing:-.068em;font-weight:500;margin:0;white-space:nowrap}
    .hero h1 span{display:block;overflow:hidden;padding-bottom:.065em}
    .hero h1 b{display:block;font:inherit;transform:translateY(115%);transition:transform 1.25s var(--ease);will-change:transform}
    .hero-ready .hero h1 span:first-child b{transform:translateY(0);transition-delay:.2s}
    .hero-ready .hero h1 span:last-child b{transform:translateY(0);transition-delay:.33s}
    .hero .hero-label,.hero .hero-role,.hero .hero-cta{opacity:0;transform:translateY(17px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
    .hero-ready .hero .hero-label{opacity:1;transform:none;transition-delay:.12s}
    .hero-ready .hero .hero-role{opacity:1;transform:none;transition-delay:.66s}
    .hero-ready .hero .hero-cta{opacity:1;transform:none;transition-delay:.8s}
    .hero-role{font-size:12px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;margin:27px 0 0;max-width:520px;line-height:1.7}
    .hero-role i{font-style:normal;color:var(--signal)}
    .hero-cta{display:inline-flex;align-items:center;gap:25px;margin-top:40px;font-size:11px;font-weight:500;letter-spacing:.21em;text-transform:uppercase}
    .circle-arrow{display:inline-flex;align-items:center;justify-content:center;width:45px;height:45px;border:1px solid #1212122a;border-radius:50%;color:var(--signal);font-size:20px;transition:.35s}
    a:hover .circle-arrow{background:var(--signal);border-color:var(--signal);color:white;transform:translateX(4px)}
    .hero-scroll{position:absolute;z-index:2;bottom:38px;left:clamp(24px,5vw,96px);display:flex;align-items:center;gap:16px;color:#5c5d59}
    .scroll-track{height:48px;width:1px;background:#1112;position:relative;overflow:hidden}
    .scroll-track:after{content:'';position:absolute;left:0;top:-50%;height:50%;width:1px;background:var(--signal);animation:scroll 2.5s linear infinite}
    @keyframes scroll{to{top:110%}}
    .hero-serial{position:absolute;z-index:2;bottom:40px;right:clamp(24px,5vw,96px);color:#797b76}
    .section{padding-block:clamp(92px,10vw,165px);position:relative}
    .section-dark{background:var(--ink);color:var(--paper)}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:56px}
    .section-kicker{display:flex;align-items:center;gap:12px;margin-bottom:34px;color:inherit;opacity:.7}
    .section-heading{font-size:clamp(53px,8vw,128px);letter-spacing:-.062em;font-weight:500;line-height:.93;margin:0}
    .section-heading .ghost{opacity:.37}
    .section-description{max-width:370px;color:#777975;font-size:16px;line-height:1.7;margin:0 0 3px}
    .section-dark .section-description{color:#a3a3a0}
    .work-controls{display:flex;align-items:center;gap:18px;min-width:175px;justify-content:flex-end}
    .work-counter{font-size:12px;white-space:nowrap}
    .work-counter span{opacity:.4}
    .work-counter em{display:inline-block;height:1px;width:36px;margin:0 12px 4px;background:#ffffff45}
    .round-button{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid #ffffff40;border-radius:50%;height:49px;width:49px;color:white;font-size:20px;transition:.3s}
    .round-button:hover:not(:disabled){background:var(--signal);border-color:var(--signal)}
    .round-button:disabled{opacity:.23;cursor:default}
    .progress-track{margin-top:54px;height:1px;width:100%;background:#ffffff29}
    .progress-line{height:1px;background:var(--signal);width:20%;transition:width .6s var(--ease)}
    .work-carousel{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth;padding-bottom:8px;margin-top:50px}
    .work-carousel::-webkit-scrollbar{display:none}
    .work-item{scroll-snap-align:start;flex:0 0 clamp(320px,43vw,680px);min-width:0}
    .work-link{display:block}
    .work-visual{height:clamp(280px,32vw,480px);position:relative;background:#1b1b1e;overflow:hidden;display:grid;place-items:center}
    .work-visual img{height:100%;width:100%;object-fit:contain}
    .work-visual img.fit-cover{object-fit:cover}
    .work-visual .index-pill{position:absolute;left:26px;top:24px;color:white;font-size:11px;text-shadow:0 1px 12px #0009}
    .work-visual .view-project{position:absolute;right:23px;bottom:24px;background:#08080880;color:white;border:1px solid #ffffff7c;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;transition:.4s;font-size:20px}
    .work-link:hover .view-project{background:var(--signal);border-color:var(--signal);transform:rotate(45deg)}
    .work-caption{padding-block:24px;border-bottom:1px solid #ffffff2c;display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
    .work-caption h3{font-weight:500;font-size:clamp(24px,2.5vw,32px);letter-spacing:-.035em;margin:0 0 7px}
    .work-caption p{color:#9a9b9c;font-size:10px;margin:0}
    .section-headline-row{display:flex;align-items:end;justify-content:space-between;gap:40px;margin-bottom:60px}
    .small-overline{color:var(--signal)}
    .brand-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:46px 28px}
    .project-card{display:block;min-width:0}
    .project-card.feature{grid-column:span 2}
    .card-image{aspect-ratio:1.44;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;background:var(--panel,#d9dad4)}
    .project-card.feature .card-image{aspect-ratio:2.08}
    .card-image img{width:100%;height:100%;object-fit:contain}
    .card-image.cover img{object-fit:cover}
    .card-image .card-arrow{position:absolute;right:20px;bottom:20px;display:grid;place-items:center;width:47px;height:47px;border-radius:50%;background:#f7f8f3ee;color:#151515;font-size:22px;transition:background .4s,color .4s,transform .4s}
    .project-card:hover .card-arrow{background:var(--signal);color:#fff;transform:rotate(45deg)}
    .project-card-info{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-top:20px;padding-bottom:21px;border-bottom:1px solid #0b0b0d30}
    .project-card-info h3{font-weight:500;font-size:clamp(23px,3vw,32px);margin:0 0 6px;letter-spacing:-.04em}
    .project-card-info .card-num{color:#888}
    .project-card-info p{color:#797b76;margin:0;font-size:10px}
    .social-section{background:#111315;color:var(--paper)}
    .social-layout{display:grid;grid-template-columns:.82fr 1.18fr;gap:clamp(32px,7vw,125px);align-items:center}
    .social-cover-frame{max-width:490px;margin:auto;position:relative}
    .social-cover-frame:before{content:'';position:absolute;inset:9% -6% -8% 16%;background:#303640;z-index:0}
    .social-cover-frame a{position:relative;z-index:1;display:block}
    .social-cover-frame img{width:100%;max-height:720px;object-fit:contain}
    .social-content .section-heading{font-size:clamp(55px,7.6vw,110px)}
    .social-content .section-description{margin-top:28px;max-width:470px}
    .social-thumbs{display:flex;gap:13px;margin-top:34px;align-items:center}
    .social-thumbs img{width:clamp(82px,8vw,119px);height:140px;object-fit:cover;object-position:top}
    .inline-link{display:inline-flex;align-items:center;gap:16px;margin-top:35px;padding-bottom:12px;border-bottom:1px solid currentColor;font-size:11px;letter-spacing:.14em;text-transform:uppercase;transition:color .3s}
    .inline-link:hover{color:var(--signal)}
    .fashion-section{background:var(--paper)}
    .fashion-card{display:grid;grid-template-columns:1.05fr .95fr;min-height:440px;background:#141416;color:white;overflow:hidden}
    .fashion-card-left{padding:clamp(32px,6vw,100px);display:flex;flex-direction:column;justify-content:space-between}
    .fashion-card-left h3{font-size:clamp(58px,9vw,160px);font-weight:500;letter-spacing:-.07em;line-height:.9;margin:36px 0}
    .fashion-card-right{padding:clamp(32px,5vw,70px);background:#202023;display:flex;align-items:flex-end;justify-content:space-between;flex-direction:column}
    .fashion-line{height:1px;width:100%;background:#ffffff30}
    .fashion-label{font-size:clamp(18px,2.5vw,26px);font-weight:300;line-height:1.5;max-width:390px;color:#d3d3d3}
    .events-section{background:#e9eae4}
    .event-visuals{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;align-items:stretch}
    .event-visuals a{display:block;position:relative;overflow:hidden;background:#1d1d1d;min-height:270px}
    .event-visuals img{width:100%;height:100%;object-fit:cover}
    .event-overlay{position:absolute;inset:auto 0 0;background:linear-gradient(transparent,#000b);color:white;padding:55px 30px 27px}
    .event-overlay b{display:block;font-size:23px;font-weight:500;margin-bottom:7px}
    .event-overlay .mono{color:#ffffffb8}
    .packaging-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .packaging-grid>a{position:relative;display:block;background:#e8e0d9;overflow:hidden}
    .packaging-grid img{height:clamp(280px,32vw,480px);width:100%;object-fit:cover}
    .packaging-grid .package-caption{padding:19px 0;background:var(--paper);display:flex;justify-content:space-between;align-items:center}
    .package-caption strong{font-size:23px;font-weight:500}
    .package-caption .mono{color:#777}
    .about{background:#200608;color:white;padding-block:0;position:relative}
    .about-stage{position:relative;min-height:clamp(650px,58vw,900px);overflow:hidden;display:flex;align-items:center}
    .about-stage picture,.about-stage picture img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
    .about-stage .layout{position:relative;z-index:2}
    .about-copy{width:min(570px,49%)}
    .about-copy .section-heading{font-size:clamp(65px,7vw,112px)}
    .about-copy p:not(.mono){font-size:clamp(15px,1.45vw,19px);line-height:1.8;color:#fffdf4da;max-width:550px;margin:24px 0}
    .stats-wrap{background:#170509;border-top:1px solid #ffffff2b}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:25px;padding-block:45px}
    .stat strong{display:block;font-size:clamp(42px,5vw,74px);font-weight:500;letter-spacing:-.06em;line-height:1}
    .stat span{display:block;color:#ffffffa8;margin-top:9px}
    .more-section{background:#f0f1eb;text-align:center}
    .more-section .section-heading{max-width:1000px;margin:0 auto}
    .more-section p{color:#676963;font-size:17px;line-height:1.8;max-width:640px;margin:32px auto 0}
    .contact{background:var(--ink);color:white;padding-bottom:50px}
    .contact-big{font-size:clamp(65px,10vw,165px);line-height:.9;letter-spacing:-.075em;font-weight:500;margin:0 0 65px}
    .contact-big span{color:var(--signal)}
    .contact-links{border-top:1px solid #ffffff33;margin-top:56px}
    .contact-links a{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff33;padding:26px 0;gap:18px;transition:color .3s}
    .contact-links a:hover{color:var(--signal)}
    .contact-links a strong{font-weight:400;font-size:clamp(19px,2.8vw,31px);letter-spacing:-.02em;overflow-wrap:anywhere}
    .contact-links a .contact-name{width:145px;color:#a8aaa7}
    .contact-links a .contact-value{flex:1}
    .contact-links a .contact-arrow{font-size:26px}
    .site-footer{background:var(--ink);color:#aaaaaa;border-top:1px solid #ffffff29;padding:30px 0}
    .site-footer-inner{display:flex;justify-content:space-between;align-items:center;gap:20px}
    .site-footer .mono{font-size:10px}
    .back-to-top{display:inline-flex;gap:12px;align-items:center;color:#ddd}
    .back-to-top:hover{color:var(--signal)}
    .detail-page{padding-top:145px;background:var(--paper);min-height:100svh}
    .detail-topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:55px;gap:20px}
    .detail-back{border:0;background:none;padding:12px 0;display:inline-flex;gap:18px;align-items:center;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase}
    .detail-back:hover{color:var(--signal)}
    .detail-intro{display:grid;grid-template-columns:1.6fr 1fr;align-items:end;gap:35px;margin-bottom:50px}
    .detail-label{display:flex;align-items:center;gap:14px;color:#6e716c;margin-bottom:27px}
    .detail-title{font-weight:500;font-size:clamp(66px,10vw,170px);letter-spacing:-.07em;line-height:.9;margin:0}
    .detail-subtitle{font-size:clamp(22px,2.5vw,36px);font-weight:300;letter-spacing:-.02em;margin:20px 0 0;color:#777976}
    .detail-desc{font-size:17px;line-height:1.75;color:#636760;margin:0 0 8px}
    .detail-cover{width:100%;max-height:min(80vh,900px);min-height:360px;object-fit:contain;background:var(--cover-bg,#1a1a1a)}
    .detail-cover.cover{object-fit:cover;aspect-ratio:16/9}
    .detail-meta{display:grid;grid-template-columns:1fr 1.4fr 1.5fr;gap:35px;padding:55px 0;border-bottom:1px solid var(--rule)}
    .detail-meta .meta-title{color:#7a7b76;margin-bottom:13px}
    .detail-meta p:not(.meta-title){font-size:17px;line-height:1.55;margin:0}
    .chip-row{display:flex;flex-wrap:wrap;gap:9px}
    .chip{padding:9px 13px;border:1px solid #c7c8c1;border-radius:40px;font-size:11px;letter-spacing:.02em;color:#555}
    .detail-section{padding-top:95px;padding-bottom:100px}
    .detail-section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:45px}
    .detail-section h2{font-weight:500;font-size:clamp(43px,6vw,86px);letter-spacing:-.055em;line-height:1;margin:0}
    .detail-section .info{font-size:11px;color:#888}
    .detail-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    .visual-tile{display:block;border:0;background:#e8e9e3;padding:0;overflow:hidden;position:relative;text-align:left;min-width:0}
    .visual-tile img{width:100%;height:auto;display:block}
    .visual-tile:after{content:'â†—';position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;background:#f7f8f3ec;display:grid;place-items:center;font-size:20px;opacity:0;transition:opacity .25s}
    .visual-tile:hover:after{opacity:1}
    .visual-tile.wide{grid-column:span 2}
    .detail-gallery img{max-width:100%}
    .video-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .video-card:first-child{grid-column:span 2}
    .video-card video{width:100%;aspect-ratio:16/9;object-fit:contain;background:#050505;display:block;max-height:700px}
    .video-card h3{font-size:18px;font-weight:400;margin:16px 0 0}
    .detail-next{background:var(--ink);color:white;padding-block:75px}
    .detail-next-link{display:flex;align-items:center;justify-content:space-between;gap:25px}
    .detail-next-link h2{font-size:clamp(48px,7.2vw,108px);font-weight:500;letter-spacing:-.055em;margin:12px 0 0}
    .detail-next-link:hover h2{color:var(--signal)}
    .lightbox{position:fixed;inset:0;background:#090909ef;z-index:250;display:none;align-items:center;justify-content:center;padding:50px 20px 20px}
    .lightbox.active{display:flex}
    .lightbox img{max-height:87vh;max-width:min(95vw,1600px);width:auto;height:auto;object-fit:contain}
    .lightbox-close{position:absolute;right:30px;top:25px;color:white;background:none;border:0;font-size:29px;padding:10px}
    .lightbox-caption{position:absolute;bottom:16px;left:30px;color:#fffd;font-size:10px}
    .fade-up{opacity:1;transform:none}
